<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6z" fill="#18324b"/></marker><pattern id="topo" width="55" height="32" patternUnits="userSpaceOnUse"><path d="M0 18Q14 3 28 18T56 18M0 30Q14 15 28 30T56 30" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></pattern></defs><rect width="1000" height="560" fill="#eef3f5"/><text x="500" y="34" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#18324b">Multi-Layered GIS Route Optimization</text><text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="14" fill="#607d8b">stack demand and constraints to identify one feasible corridor</text><g font-family="Arial" font-weight="700" fill="#fff"><rect x="45" y="100" width="470" height="85" rx="12" fill="#c4575c"/><path d="M70 155Q160 110 250 155T430 135" fill="none" stroke="#fff" stroke-width="6" opacity=".8"/><circle cx="90" cy="145" r="7"/><circle cx="430" cy="135" r="7"/><text x="280" y="125" text-anchor="middle" font-size="19">1. O-D DESIRE LINES</text><text x="280" y="160" text-anchor="middle" font-size="13" font-weight="400">where movement demand is concentrated</text><rect x="105" y="205" width="470" height="85" rx="12" fill="#d28a4b"/><path d="M135 230h120v40H135zM310 225h200v45H310z" fill="#fff" opacity=".23"/><text x="340" y="232" text-anchor="middle" font-size="19">2. LAND USE / ROW</text><text x="340" y="267" text-anchor="middle" font-size="13" font-weight="400">settlements, property, utilities, protected areas</text><rect x="165" y="310" width="470" height="85" rx="12" fill="#397c8c"/><rect x="165" y="310" width="470" height="85" rx="12" fill="url(#topo)"/><path d="M200 375Q280 325 355 370T520 350" fill="none" stroke="#fff" stroke-width="4" opacity=".7"/><text x="400" y="337" text-anchor="middle" font-size="19">3. TOPOGRAPHY / HYDROLOGY</text><text x="400" y="372" text-anchor="middle" font-size="13" font-weight="400">slopes, drainage, flooding, water crossings</text></g><g fill="none" stroke="#18324b" stroke-width="4" marker-end="url(#arrow)"><path d="M515 142h110"/><path d="M575 247h50"/><path d="M635 352h-10"/></g><g transform="translate(690 105)"><rect width="260" height="290" rx="14" fill="#fff" stroke="#18324b" stroke-width="3"/><text x="130" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#18324b">OUTPUT</text><path d="M45 80Q105 35 160 85T220 70M45 150Q100 110 160 155T220 140M45 220Q105 175 160 225T220 210" fill="none" stroke="#b8c9cb" stroke-width="14"/><path d="M42 235Q105 185 165 125T225 60" fill="none" stroke="#c4575c" stroke-width="14" stroke-linecap="round"/><path d="M42 235Q105 185 165 125T225 60" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="130" y="265" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#18324b">FEASIBLE ROUTE</text><text x="130" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#607d8b">best balance of demand</text><text x="130" y="302" text-anchor="middle" font-family="Arial" font-size="12" fill="#607d8b">and constraints</text></g><text x="500" y="450" text-anchor="middle" font-family="Arial" font-size="15" fill="#18324b">GIS synthesis: demand vectors + social constraints + physical constraints</text><text x="500" y="478" text-anchor="middle" font-family="Arial" font-size="13" fill="#607d8b">The preferred route is not simply the shortest route.</text></svg>