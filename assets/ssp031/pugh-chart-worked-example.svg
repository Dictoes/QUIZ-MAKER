<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title">
  <title id="title">Worked Pugh chart for shower transfer aid</title>
  <rect width="760" height="380" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#321c2b">
    <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700">Shower / Transfer Aid — Weighted Totals</text>
    <g font-size="18"><text x="70" y="82">Shower Steps</text><text x="600" y="82" fill="#9d547f" font-weight="700">-13</text><text x="70" y="132">Swivel Chair w/ Hinge Leg (datum)</text><text x="600" y="132">0</text><text x="70" y="182">Hydraulic Swivel Chair</text><text x="600" y="182">-3</text><text x="70" y="232">Pivoting Tub</text><text x="600" y="232">-38</text><text x="70" y="282" fill="#9d547f" font-weight="700">Shower Grips</text><text x="600" y="282" fill="#9d547f" font-weight="700">+15</text><text x="70" y="332">Tub Door</text><text x="600" y="332">+13</text></g>
    <g stroke="#c99ab8" stroke-width="2"><line x1="50" y1="55" x2="700" y2="55"/><line x1="50" y1="100" x2="700" y2="100"/><line x1="50" y1="150" x2="700" y2="150"/><line x1="50" y1="200" x2="700" y2="200"/><line x1="50" y1="250" x2="700" y2="250"/><line x1="50" y1="300" x2="700" y2="300"/><line x1="50" y1="350" x2="700" y2="350"/></g>
  </g>
</svg>
