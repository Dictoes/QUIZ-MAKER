<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Kansei Engineering concept</title>
  <desc id="desc">Human feelings and product capability combine to produce a product designed using Kansei Engineering.</desc>
  <rect width="900" height="260" rx="24" fill="#f7edf3"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="62" width="235" height="125" rx="18" fill="#fff" stroke="#9d547f" stroke-width="3"/>
    <text x="152" y="105" font-size="22" font-weight="700" fill="#54233f">Human feelings</text>
    <text x="152" y="140" font-size="17" fill="#54233f">emotional response</text>
    <text x="152" y="166" font-size="17" fill="#54233f">needs and impressions</text>
    <text x="315" y="140" font-size="46" font-weight="700" fill="#9d547f">+</text>
    <rect x="335" y="62" width="235" height="125" rx="18" fill="#fff" stroke="#9d547f" stroke-width="3"/>
    <text x="452" y="105" font-size="22" font-weight="700" fill="#54233f">Product capability</text>
    <text x="452" y="140" font-size="17" fill="#54233f">properties and features</text>
    <text x="452" y="166" font-size="17" fill="#54233f">what the product can do</text>
    <text x="615" y="140" font-size="46" font-weight="700" fill="#9d547f">=</text>
    <rect x="640" y="62" width="225" height="125" rx="18" fill="#9d547f"/>
    <text x="752" y="103" font-size="20" font-weight="700" fill="#fff">Kansei-designed</text>
    <text x="752" y="130" font-size="20" font-weight="700" fill="#fff">product</text>
    <text x="752" y="161" font-size="15" fill="#fff">intended feeling + function</text>
    <text x="450" y="225" font-size="18" fill="#54233f">Engineering based on human feelings</text>
  </g>
</svg>
